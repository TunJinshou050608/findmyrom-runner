name: TG · 抓取
'on':
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: tg01-annibale-private-trial
  cancel-in-progress: false
jobs:
  fetch:
    if: github.ref == 'refs/heads/main' && vars.FMR_TG_FETCH_ENABLED == 'true'
    runs-on:
    - self-hosted
    - findmyrom-metadata
    timeout-minutes: 90
    environment: production
    env:
      FMR_CATALOGUE_STATE_DIR: ${{ vars.FMR_CATALOGUE_STATE_DIR || '/var/lib/findmyrom/catalogue-v3' }}
    steps:
    - uses: actions/checkout@v4
      with:
        path: runner
        persist-credentials: false
    - uses: actions/checkout@v4
      with:
        repository: TunJinshou050608/findmyrom-tg01-test
        path: state
        ssh-key: ${{ secrets.GH_TG_TEST_SSH_KEY }}
        persist-credentials: true
    - name: Prepare local container Python
      run: |-
        python3 -m venv "$RUNNER_TEMP/fmr-tg-${GITHUB_RUN_ID}"
        printf '%s\n' "$RUNNER_TEMP/fmr-tg-${GITHUB_RUN_ID}/bin" >> "$GITHUB_PATH"
    - run: python -m pip install -r runner/requirements.txt
    - name: One automatic device batch; metadata only
      working-directory: runner
      env:
        GITHUB_TOKEN: ${{ github.token }}
        LLM_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        LLM_MODEL_NAME: deepseek-flash
        LLM_REASONING_EFFORT: low
      run: python -u -m fmr_tg_scanner.search_lab --state-dir ../state --mode batch
    - name: Save private checkpoints and receipts
      if: always()
      working-directory: runner
      run: |-
        python - <<'PYCODE'
        from pathlib import Path
        from fmr_tg_scanner.watch import publish_private
        publish_private(Path('../state').resolve())
        PYCODE
