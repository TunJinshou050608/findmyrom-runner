name: TG quality replay · frozen input, no crawling
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/telegram_quality_replay.yml'
      - 'fmr_tg_scanner/quality_filter.py'
      - 'fmr_tg_scanner/quality_replay.py'
      - 'tests/test_quality_filter.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: telegram-quality-replay
  cancel-in-progress: false
jobs:
  replay:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          path: runner
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: TunJinshou050608/findmyrom-tg01-test
          path: state
          fetch-depth: 0
          ssh-key: ${{ secrets.GH_TG_TEST_SSH_KEY }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r runner/requirements.txt
      - name: Assert existing collection and scheduling sources unchanged
        working-directory: runner
        run: |
          python - <<'PY'
          import subprocess
          base='5126e950fada1d4adba02de98e02b3a7d04d7109'
          paths=subprocess.check_output(['git','ls-tree','-r','--name-only',base],text=True).splitlines()
          protected=[p for p in paths if p.startswith('fmr_tg_scanner/') or p.startswith('.github/workflows/telegram_')]
          subprocess.run(['git','diff','--exit-code',base,'HEAD','--',*protected],check=True)
          print('Existing Telegram acquisition, parsing, policy and scheduling files match the frozen baseline.')
          PY
      - name: Synthetic filtering regressions
        working-directory: runner
        run: python -m unittest discover -s tests -p test_quality_filter.py -v
      - name: Replay the SAME audited messages with network disabled
        working-directory: runner
        run: |
          python - <<'PY'
          import hashlib,json,os,runpy,socket,sqlite3,subprocess,sys
          from pathlib import Path
          state=Path('../state').resolve()
          frozen='0d2842ff6c5afa2f60eb886cf554e597aab48da5'
          bench='55896afe5713a4007c5b9ade1efbc61c0650f3a0'
          work=Path('/tmp/fmr-quality-frozen');work.mkdir(exist_ok=True)
          def blob(ref,path):
              return subprocess.check_output(['git','show',ref+':'+path],cwd=state)
          rows=[];hashes={}
          for i in range(51):
              path='audits/alioth-20261102/records-'+str(i).zfill(3)+'.json'
              raw=blob(frozen,path);hashes[path]=hashlib.sha256(raw).hexdigest()
              rows.extend(json.loads(raw))
          if len(rows)!=2008 or any(r['live_status']!='live_exact' for r in rows):
              raise ValueError('Frozen audit inventory is incomplete')
          (work/'input.json').write_text(json.dumps(rows,ensure_ascii=False))
          (work/'benchmark.json').write_bytes(blob(bench,'audits/alioth-20261102/quality-benchmark-v1.json'))
          (work/'source.sqlite').write_bytes(blob(frozen,'search-v3/search.sqlite'))
          db=sqlite3.connect('file:'+str(work/'source.sqlite')+'?mode=ro',uri=True)
          value=db.execute("SELECT value FROM tg_search_meta WHERE key='device_aliases_v3'").fetchone()
          if value is None:raise ValueError('Frozen catalogue aliases missing')
          catalogue=json.loads(value[0]);db.close()
          (work/'catalogue.json').write_text(json.dumps(catalogue,ensure_ascii=False))
          dest=state/'audits/alioth-20261102/quality-v1';dest.mkdir(parents=True,exist_ok=True)
          manifest={'input_ref':frozen,'benchmark_ref':bench,'input_file_sha256':hashes,
             'code_sha':os.environ['GITHUB_SHA'],'catalogue_codes':len(catalogue),
             'acquisition_baseline':'5126e950fada1d4adba02de98e02b3a7d04d7109',
             'acquisition_source_unchanged':True,'network_disabled_for_replay':True}
          (dest/'manifest.json').write_text(json.dumps(manifest,indent=2))
          def blocked(*args,**kwargs):raise RuntimeError('Network forbidden in fixed-input quality comparison')
          socket.create_connection=blocked
          socket.socket.connect=blocked
          socket.socket.connect_ex=blocked
          sys.argv=['quality_replay','--input',str(work/'input.json'),'--benchmark',str(work/'benchmark.json'),
                    '--catalogue',str(work/'catalogue.json'),'--output',str(dest)]
          runpy.run_module('fmr_tg_scanner.quality_replay',run_name='__main__')
          PY
      - name: Preserve private comparison even if a reference regresses
        if: always()
        working-directory: runner
        run: |
          python - <<'PY'
          from pathlib import Path
          from fmr_tg_scanner.watch import publish_private
          publish_private(Path('../state').resolve())
          PY

