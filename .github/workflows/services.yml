name: 服务 · 维护与检查
'on':
  push:
    branches: [main]
    paths: [.github/workflows/services.yml]
  schedule:
  - cron: '*/15 * * * *'
  - cron: 43 */6 * * *
  workflow_dispatch:
    inputs:
      service:
        type: choice
        options:
        - check
        - sony_bundle
        - public_index
        default: check
        description: 选择维护任务
permissions:
  contents: read
  actions: write
jobs:
  sony_bundle:
    if: github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.service == 'sony_bundle') || (github.event_name == 'schedule' && github.event.schedule == '*/15 * * * *'))
    name: 按需下载并打包成一个 ZIP（不提取镜像）
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
    - run: python -m pip install -r requirements.txt
    - name: 有请求才构建，成品为单个完整 ZIP
      env:
        CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
        SONY_BUNDLE_UPLOAD_SECRET: ${{ secrets.SONY_BUNDLE_UPLOAD_SECRET }}
      run: python -u -m fmr_ingest_stock.sony_bundle
    concurrency:
      group: sony-complete-bundle-cache
      cancel-in-progress: false
  public_index:
    if: github.ref == 'refs/heads/main' && (vars.FMR_JUMPER_ENABLED == 'true') && ((github.event_name == 'workflow_dispatch' && inputs.service == 'public_index') || (github.event_name == 'schedule' && github.event.schedule
      == '43 */6 * * *'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
    - uses: actions/checkout@v4
      with:
        path: runner
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: python -m pip install -r runner/requirements.txt
    - name: Generate public Markdown only
      working-directory: runner
      env:
        CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
        CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        PUBLIC_SITE_URL: https://findmyrom.com
      run: python -m fmr_extractor.jumper_sync --output-dir ../projection
    - name: Check out public index with its dedicated write key
      uses: actions/checkout@v4
      with:
        repository: TunJinshou050608/android-boot-images-index
        path: public-index
        ssh-key: ${{ secrets.GH_JUMPER_SSH_KEY }}
        persist-credentials: true
    - name: Publish changed Markdown
      shell: bash
      run: |
        set -euo pipefail
        cp projection/README.md public-index/README.md
        mkdir -p projection/devices
        mkdir -p public-index/devices
        rsync -a --delete projection/devices/ public-index/devices/
        cd public-index
        git add -- README.md devices
        if git diff --cached --quiet; then
          echo 'Public index is unchanged.' >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        git -c user.name=FindMyROM -c user.email=automation@findmyrom.com commit -m 'Update firmware and boot image index'
        git push origin HEAD:main
        echo 'Published public Markdown; all downloads return to findmyrom.com.' >> "$GITHUB_STEP_SUMMARY"
    concurrency:
      group: public-jumper-index
      cancel-in-progress: false
  check:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: [self-hosted, Linux, X64, findmyrom-metadata]
    timeout-minutes: 12
    concurrency:
      group: samsung-live-archive-recheck
      cancel-in-progress: false
    steps:
      - name: Cancel only the hung Samsung acceptance run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/TunJinshou050608/findmyrom-runner/actions/runs/41589883620/cancel
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: samsung-check-${{ github.run_id }}
      - name: Prepare isolated environment
        run: |
          python3 -m venv "$RUNNER_TEMP/samsung-check-${GITHUB_RUN_ID}"
          "$RUNNER_TEMP/samsung-check-${GITHUB_RUN_ID}/bin/python" -m pip install -r "samsung-check-${GITHUB_RUN_ID}/requirements.txt"
      - name: Historical Samsung image and complete ZIP live delivery
        working-directory: samsung-check-${{ github.run_id }}
        run: '"$RUNNER_TEMP/samsung-check-${GITHUB_RUN_ID}/bin/python" -u -m fmr_ingest_stock.samsung_delivery_acceptance --token fw_mf0OHSvjak7G --partition boot'
      - name: Remove isolated test environment
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/samsung-check-${GITHUB_RUN_ID}"
