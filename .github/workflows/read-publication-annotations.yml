name: Read publication annotations
on:
  push:
    branches: [fix/publication-queue-validation]
    paths: [.github/workflows/read-publication-annotations.yml]
permissions:
  checks: read
jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/check-runs/131807202097/annotations" --jq '.[] | {annotation_level,message}'
