name: "realme · 固件目录更新"
run-name: "realme · 增量更新 · 第 ${{ inputs.batch || '1' }} 批"
on:
  schedule:
    - cron: '5 */6 * * *'
  workflow_dispatch:
    inputs:
      operation:
        description: "增量续跑 / 重试失败项 / 重新核对来源"
        type: choice
        options: [incremental, retry_failed, refresh_sources]
        default: incremental
      mode:
        description: "兼容旧入口；采集仅暂存，由每10分钟统一发布"
        type: choice
        options: [audit, publish]
        default: audit
      cycle:
        description: "兼容旧续跑参数，手动留空"
        default: ''
      batch:
        description: "自动续跑批次"
        default: '1'
permissions:
  contents: read
  actions: write
concurrency:
  group: catalogue-v2-realme
  cancel-in-progress: false
jobs:
  catalogue:
    name: "采集、复用缓存、加密保存断点（不访问D1）"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      GH_WORKFLOW_TOKEN: ${{ github.token }}
      SIGN_PRIVATE_KEY_HEX: ${{ secrets.SIGN_PRIVATE_KEY_HEX }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: "接续检查点采集（每30秒心跳，D1零请求）"
        id: collect
        continue-on-error: true
        env:
          CATALOGUE_OPERATION: ${{ inputs.operation || 'incremental' }}
        run: python -u -m fmr_ingest_stock.staged_catalogue collect --vendor realme --operation "$CATALOGUE_OPERATION"
      - name: "持久保存加密进度；断开后可续接"
        if: always()
        id: snapshot
        uses: actions/upload-artifact@v4
        with:
          name: catalogue-v3-realme
          path: catalogue-state/upload/realme.sqlite.enc
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: "仅保留最近三份加密快照"
        if: steps.snapshot.outcome == 'success'
        run: python -m fmr_ingest_stock.staged_catalogue prune --vendor realme
      - name: "有积压就自动接下一批"
        if: steps.snapshot.outcome == 'success' && steps.collect.outcome == 'success'
        run: python -m fmr_ingest_stock.staged_catalogue next --vendor realme
      - name: "报告本批中断"
        if: steps.collect.outcome == 'failure'
        run: exit 1
