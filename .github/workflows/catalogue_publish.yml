name: D1 · 统一发布
'on':
  schedule:
  - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      scope:
        type: choice
        options:
        - all
        - tg
        default: all
        description: 官包与TG，或仅TG
      max_records:
        description: 单批最多发布记录数（默认 180，测试可用 1000）
        default: '180'
      once:
        type: choice
        options:
        - 'false'
        - 'true'
        default: 'false'
        description: 只跑一个发布窗口，不交接下一执行器（测试用）
      tg_unlimited:
        type: choice
        options:
        - 'false'
        - 'true'
        default: 'false'
        description: 本次 TG 发布不套用预算上限
  push:
    branches:
    - main
    paths:
    - .github/workflows/catalogue_publish.yml
permissions:
  contents: read
  actions: write
jobs:
  schema:
    name: D1 · 版本化兼容检查与增量迁移
    if: "github.ref == 'refs/heads/main' && github.event_name != 'push' && (vars.FMR_TG_D1_WRITES_PAUSED != 'true' ||\n (inputs.scope\
      \ != 'tg' && (vars.FMR_D1_WRITES_PAUSED != 'true' || vars.FMR_SAMSUNG_D1_WRITES_PAUSED != 'true')))"
    runs-on: ${{ fromJSON(vars.FMR_PUBLISH_RUNNER || vars.FMR_CATALOGUE_RUNNER || '["self-hosted","findmyrom-metadata"]')
      }}
    timeout-minutes: 10
    environment: production
    concurrency:
      group: d1-schema-maintenance
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        path: schema-code-${{ github.run_id }}
    - name: Prepare isolated migration runtime
      run: 'python3 -m venv "$RUNNER_TEMP/fmr-schema-${GITHUB_RUN_ID}"

        "$RUNNER_TEMP/fmr-schema-${GITHUB_RUN_ID}/bin/python" -m pip install -r requirements.txt

        '
    - name: 原子迁移；完成前禁止发布任务前移确认点
      env:
        CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
        CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      run: '"$RUNNER_TEMP/fmr-schema-${GITHUB_RUN_ID}/bin/python" -m fmr_core.schema_migrations --apply --through 5'
    - name: 独立增补固件元数据表；不执行型号重建迁移
      env:
        CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
        CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      run: '"$RUNNER_TEMP/fmr-schema-${GITHUB_RUN_ID}/bin/python" -m fmr_core.firmware_metadata_schema --apply'
    - name: Clean isolated runtime
      if: always()
      run: rm -rf -- "$RUNNER_TEMP/fmr-schema-${GITHUB_RUN_ID}"
    defaults:
      run:
        working-directory: schema-code-${{ github.run_id }}
  publish:
    needs: schema
    if: github.ref == 'refs/heads/main' && vars.FMR_D1_WRITES_PAUSED != 'true' && github.event_name != 'push' && inputs.scope
      != 'tg'
    runs-on: ${{ fromJSON(vars.FMR_PUBLISH_RUNNER || vars.FMR_CATALOGUE_RUNNER || '["self-hosted","findmyrom-metadata"]')
      }}
    timeout-minutes: 115
    environment: production
    env:
      GH_WORKFLOW_TOKEN: ${{ github.token }}
      FMR_CATALOGUE_LOCAL_STATE: 'true'
      FMR_CATALOGUE_STATE_DIR: ${{ vars.FMR_CATALOGUE_STATE_DIR || '/var/lib/findmyrom/catalogue-v3' }}
      SIGN_PRIVATE_KEY_HEX: ${{ secrets.SIGN_PRIVATE_KEY_HEX }}
      FMR_D1_WRITES_PAUSED: ${{ vars.FMR_D1_WRITES_PAUSED }}
      FMR_CATALOGUE_PUBLISH_MAX_RECORDS: ${{ inputs.max_records || '180' }}
      FMR_CATALOGUE_PUBLISH_ONCE: ${{ inputs.once || 'false' }}
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        path: publisher-code
    - name: Prepare isolated Python environment
      shell: bash
      run: 'python3 -m venv "$RUNNER_TEMP/fmr-python"

        printf ''%s\n'' "$RUNNER_TEMP/fmr-python/bin" >> "$GITHUB_PATH"

        '
    - run: python -m pip install -r requirements.txt
    - name: 去重后批量入库；按实际行数控制预算
      env:
        CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
        CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      run: python -u -m fmr_ingest_stock.catalogue_publish_monitor
      id: sync
    - name: 校验本次发布确认点的新鲜度和完整性
      id: export_check
      if: always() && (steps.sync.outcome == 'success' || steps.sync.outcome == 'failure')
      run: python -u -m fmr_ingest_stock.staged_catalogue verify-export --scope publisher
    - name: 保存发布确认点，失败也保留成功部分
      if: always() && steps.export_check.outcome == 'success'
      id: snapshot
      uses: actions/upload-artifact@v4
      with:
        name: catalogue-v3-publisher
        path: ${{ env.FMR_CATALOGUE_STATE_DIR }}/upload/publisher.sqlite.enc
        if-no-files-found: error
        retention-days: 90
        compression-level: 0
    - name: 仅保留最近三份发布确认点
      if: steps.snapshot.outcome == 'success'
      run: 'python -c ''from fmr_ingest_stock.staged_catalogue import Artifacts; a=Artifacts(); a.prune("publisher"); a.close()''

        '
    - name: 交接下一驻留执行器；cron保留作故障恢复
      if: ${{ !cancelled() && steps.snapshot.outcome == 'success' && inputs.once != 'true' }}
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: gh workflow run catalogue_publish.yml --ref main
    name: 官包 · 每10分钟增量发布
    concurrency:
      group: catalogue-d1-publisher
      cancel-in-progress: false
    defaults:
      run:
        working-directory: publisher-code
  samsung:
    needs: schema
    if: github.ref == 'refs/heads/main' && vars.FMR_D1_WRITES_PAUSED == 'true' && vars.FMR_SAMSUNG_D1_WRITES_PAUSED != 'true'
      && inputs.scope != 'tg'
    runs-on: ${{ fromJSON(vars.FMR_PUBLISH_RUNNER || vars.FMR_CATALOGUE_RUNNER || '["self-hosted","findmyrom-metadata"]')
      }}
    timeout-minutes: 115
    environment: production
    env:
      GH_WORKFLOW_TOKEN: ${{ github.token }}
      FMR_CATALOGUE_LOCAL_STATE: 'true'
      FMR_CATALOGUE_STATE_DIR: ${{ vars.FMR_CATALOGUE_STATE_DIR || '/var/lib/findmyrom/catalogue-v3' }}
      SIGN_PRIVATE_KEY_HEX: ${{ secrets.SIGN_PRIVATE_KEY_HEX }}
      FMR_D1_WRITES_PAUSED: 'false'
      FMR_CATALOGUE_PUBLISH_VENDORS: samsung
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        path: samsung-publisher-code
    - name: Prepare isolated Python environment
      shell: bash
      run: 'python3 -m venv "$RUNNER_TEMP/fmr-python"

        printf ''%s\n'' "$RUNNER_TEMP/fmr-python/bin" >> "$GITHUB_PATH"

        '
    - run: python -m pip install -r requirements.txt
    - name: 去重后批量入库；按实际行数控制预算
      env:
        CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
        CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      run: python -u -m fmr_ingest_stock.catalogue_publish_monitor
      id: sync
    - name: 校验本次发布确认点的新鲜度和完整性
      id: export_check
      if: always() && (steps.sync.outcome == 'success' || steps.sync.outcome == 'failure')
      run: python -u -m fmr_ingest_stock.staged_catalogue verify-export --scope publisher
    - name: 保存发布确认点，失败也保留成功部分
      if: always() && steps.export_check.outcome == 'success'
      id: snapshot
      uses: actions/upload-artifact@v4
      with:
        name: catalogue-v3-publisher
        path: ${{ env.FMR_CATALOGUE_STATE_DIR }}/upload/publisher.sqlite.enc
        if-no-files-found: error
        retention-days: 90
        compression-level: 0
    - name: 仅保留最近三份发布确认点
      if: steps.snapshot.outcome == 'success'
      run: 'python -c ''from fmr_ingest_stock.staged_catalogue import Artifacts; a=Artifacts(); a.prune("publisher"); a.close()''

        '
    - name: 交接下一三星驻留发布执行器；cron保留作故障恢复
      if: ${{ !cancelled() && steps.snapshot.outcome == 'success' }}
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: gh workflow run catalogue_publish.yml --ref main -f scope=all
    name: 三星 · 每10分钟增量发布
    concurrency:
      group: catalogue-d1-publisher
      cancel-in-progress: false
    defaults:
      run:
        working-directory: samsung-publisher-code
  telegram:
    needs: schema
    if: github.ref == 'refs/heads/main' && vars.FMR_TG_D1_WRITES_PAUSED != 'true'
    runs-on:
    - self-hosted
    - findmyrom-metadata
    timeout-minutes: 30
    environment: production
    env:
      FMR_TG_STATE_DIR: ${{ vars.FMR_TG_STATE_DIR || format('{0}/tg-v4', vars.FMR_CATALOGUE_STATE_DIR || '/var/lib/findmyrom/catalogue-v3')
        }}
      FMR_CATALOGUE_STATE_DIR: ${{ vars.FMR_CATALOGUE_STATE_DIR || '/var/lib/findmyrom/catalogue-v3' }}
      FMR_TG_LOCAL_RUNTIME: 'true'
      FMR_D1_BUDGET_ENFORCE: ${{ inputs.tg_unlimited == 'true' && 'false' || 'true' }}
    name: TG · 本地合格批次增量写入 D1
    concurrency:
      group: tg-local-d1-publication
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        path: tg-code-${{ github.run_id }}
    - name: Confirm local runner and prepare Python
      run: 'printf "Runner: %s; host: %s\n" "$RUNNER_NAME" "$(hostname)"

        python3 -m venv "$RUNNER_TEMP/fmr-tg-local-${GITHUB_RUN_ID}"

        printf ''%s\n'' "$RUNNER_TEMP/fmr-tg-local-${GITHUB_RUN_ID}/bin" >> "$GITHUB_PATH"'
    - run: python -m pip install -r requirements.txt
    - name: Publish locally audited resources; unchanged rows are not rewritten
      env:
        CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
        CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        SIGN_PRIVATE_KEY_HEX: ${{ secrets.SIGN_PRIVATE_KEY_HEX }}
      run: python -u -m fmr_tg_scanner.local_runtime publish --state-dir "$FMR_TG_STATE_DIR"
    defaults:
      run:
        working-directory: tg-code-${{ github.run_id }}
  acceptance:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && contains(github.event.head_commit.message, '[publication-canary]')
    runs-on: ${{ fromJSON(vars.FMR_PUBLISH_RUNNER || vars.FMR_CATALOGUE_RUNNER || '["self-hosted","findmyrom-metadata"]')
      }}
    timeout-minutes: 20
    environment: production
    env:
      GH_WORKFLOW_TOKEN: ${{ github.token }}
      FMR_CATALOGUE_LOCAL_STATE: 'true'
      FMR_CATALOGUE_STATE_DIR: ${{ vars.FMR_CATALOGUE_STATE_DIR || '/var/lib/findmyrom/catalogue-v3' }}
      SIGN_PRIVATE_KEY_HEX: ${{ secrets.SIGN_PRIVATE_KEY_HEX }}
      FMR_D1_WRITES_PAUSED: 'false'
      FMR_CATALOGUE_PUBLISH_MAX_RECORDS: '5'
      FMR_CATALOGUE_PUBLISH_ONCE: 'true'
      FMR_CATALOGUE_PUBLISH_VENDORS: xiaomi,google
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        path: publisher-code
        ref: d1f95a9b60f8056dff8a65fa6fae8baa83a80487
    - name: Prepare isolated Python environment
      shell: bash
      run: 'python3 -m venv "$RUNNER_TEMP/fmr-python"

        printf ''%s\n'' "$RUNNER_TEMP/fmr-python/bin" >> "$GITHUB_PATH"

        '
    - run: python -m pip install -r requirements.txt
    - name: 去重后批量入库；按实际行数控制预算
      env:
        CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
        CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      run: python -u -m fmr_ingest_stock.catalogue_publish_monitor
      id: sync
    - name: 校验本次发布确认点的新鲜度和完整性
      id: export_check
      if: always() && (steps.sync.outcome == 'success' || steps.sync.outcome == 'failure')
      run: python -u -m fmr_ingest_stock.staged_catalogue verify-export --scope publisher
    - name: 保存发布确认点，失败也保留成功部分
      if: always() && steps.export_check.outcome == 'success'
      id: snapshot
      uses: actions/upload-artifact@v4
      with:
        name: catalogue-v3-publisher
        path: ${{ env.FMR_CATALOGUE_STATE_DIR }}/upload/publisher.sqlite.enc
        if-no-files-found: error
        retention-days: 90
        compression-level: 0
    - name: 仅保留最近三份发布确认点
      if: steps.snapshot.outcome == 'success'
      run: 'python -c ''from fmr_ingest_stock.staged_catalogue import Artifacts; a=Artifacts(); a.prune("publisher"); a.close()''

        '
    name: 限量验收 · 5条 · 无自动交接
    concurrency:
      group: catalogue-d1-publisher
      cancel-in-progress: false
    defaults:
      run:
        working-directory: publisher-code
