name: "统一发布 · 每10分钟增量同步D1"
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: catalogue-d1-publisher
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ fromJSON(vars.FMR_CATALOGUE_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 9
    environment: production
    env:
      GH_WORKFLOW_TOKEN: ${{ github.token }}
      SIGN_PRIVATE_KEY_HEX: ${{ secrets.SIGN_PRIVATE_KEY_HEX }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare isolated Python environment
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/fmr-python"
          printf '%s\n' "$RUNNER_TEMP/fmr-python/bin" >> "$GITHUB_PATH"
      - run: python -m pip install -r requirements.txt
      - name: "去重后批量入库；按实际行数控制预算"
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python -u -m fmr_ingest_stock.catalogue_publish
      - name: "保存发布确认点，失败也保留成功部分"
        if: always()
        id: snapshot
        uses: actions/upload-artifact@v4
        with:
          name: catalogue-v3-publisher
          path: catalogue-state/upload/publisher.sqlite.enc
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: "仅保留最近三份发布确认点"
        if: steps.snapshot.outcome == 'success'
        run: |
          python -c 'from fmr_ingest_stock.staged_catalogue import Artifacts; a=Artifacts(); a.prune("publisher"); a.close()'
