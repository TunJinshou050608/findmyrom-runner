name: Catalogue D1 Publisher
'on':
  schedule:
  - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      scope:
        type: choice
        options:
        - all
        - stock
        - tg
        default: all
        description: Publish stock and TG, stock only, or TG only
      batch_size:
        type: string
        required: false
        default: '40'
        description: Maximum stock records published per batch
      tg_unlimited:
        type: boolean
        required: false
        default: false
        description: Disable TG D1 budget enforcement for this manual run
permissions:
  contents: read
jobs:
  publish:
    name: Stock · Outbox to D1 Publisher
    if: github.ref == 'refs/heads/main' && inputs.scope != 'tg' && vars.FMR_D1_WRITES_PAUSED != 'true'
    runs-on: ${{ fromJSON(vars.FMR_PUBLISH_RUNNER || vars.FMR_CATALOGUE_RUNNER || '["self-hosted","findmyrom-publisher"]') }}
    environment: production
    timeout-minutes: 15
    concurrency:
      group: catalogue-d1-publisher
      cancel-in-progress: false
    env:
      FMR_STAGING_V4_DIR: ${{ vars.FMR_STAGING_V4_DIR || '/var/lib/findmyrom/staging-v4' }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      SIGN_PRIVATE_KEY_HEX: ${{ secrets.SIGN_PRIVATE_KEY_HEX }}
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Prepare shared or isolated Python environment
      shell: bash
      run: |
        set -euo pipefail
        REQ_HASH="$(sha256sum requirements.txt | cut -c1-16)"
        if [ -d /opt/fmr-venvs ] && [ -w /opt/fmr-venvs ]; then
          VENV_DIR="/opt/fmr-venvs/$REQ_HASH"
          if [ ! -x "$VENV_DIR/bin/python" ]; then
            (
              flock -x 9
              if [ ! -x "$VENV_DIR/bin/python" ]; then
                TMP_VENV="$(mktemp -d "/opt/fmr-venvs/.tmp-${REQ_HASH}-XXXXXX")"
                trap 'rm -rf "$TMP_VENV"' EXIT
                python3 -m venv "$TMP_VENV"
                "$TMP_VENV/bin/python" -m pip install --disable-pip-version-check -r requirements.txt
                mv "$TMP_VENV" "$VENV_DIR"
                trap - EXIT
              fi
            ) 9>/opt/fmr-venvs/.lock
          fi
        else
          VENV_DIR="$RUNNER_TEMP/fmr-venv-${GITHUB_RUN_ID}"
          python3 -m venv "$VENV_DIR"
          "$VENV_DIR/bin/python" -m pip install --disable-pip-version-check -r requirements.txt
        fi
        printf '%s\n' "$VENV_DIR/bin" >> "$GITHUB_PATH"
    - name: Publish staged stock firmware batches to D1
      shell: bash
      run: |
        python -m fmr_ingest_stock.pipeline.cli publish \
          --state-dir "$FMR_STAGING_V4_DIR" \
          --batch-size "${{ inputs.batch_size || '40' }}"
    - name: Clean fallback isolated runtime
      if: always()
      shell: bash
      run: rm -rf -- "$RUNNER_TEMP/fmr-venv-${GITHUB_RUN_ID}"
  telegram:
    name: TG · 本地合格批次增量写入 D1
    if: github.ref == 'refs/heads/main' && inputs.scope != 'stock' && vars.FMR_TG_D1_WRITES_PAUSED != 'true'
    runs-on:
    - self-hosted
    - findmyrom-metadata
    timeout-minutes: 30
    environment: production
    env:
      FMR_TG_STATE_DIR: ${{ vars.FMR_TG_STATE_DIR || format('{0}/tg-v4', vars.FMR_CATALOGUE_STATE_DIR || '/var/lib/findmyrom/catalogue-v3') }}
      FMR_CATALOGUE_STATE_DIR: ${{ vars.FMR_CATALOGUE_STATE_DIR || '/var/lib/findmyrom/catalogue-v3' }}
      FMR_TG_LOCAL_RUNTIME: 'true'
      FMR_D1_BUDGET_ENFORCE: ${{ (inputs.tg_unlimited == true || inputs.tg_unlimited == 'true') && 'false' || 'true' }}
    concurrency:
      group: tg-local-d1-publication
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        path: tg-code-${{ github.run_id }}
    - name: Confirm local runner and prepare Python
      run: |-
        printf "Runner: %s; host: %s\n" "$RUNNER_NAME" "$(hostname)"
        python3 -m venv "$RUNNER_TEMP/fmr-tg-local-${GITHUB_RUN_ID}"
        printf '%s\n' "$RUNNER_TEMP/fmr-tg-local-${GITHUB_RUN_ID}/bin" >> "$GITHUB_PATH"
    - run: python -m pip install -r requirements.txt
    - name: Publish locally audited resources; unchanged rows are not rewritten
      env:
        CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
        CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        SIGN_PRIVATE_KEY_HEX: ${{ secrets.SIGN_PRIVATE_KEY_HEX }}
      run: python -u -m fmr_tg_scanner.local_runtime publish --state-dir "$FMR_TG_STATE_DIR"
    - name: Clean isolated runtime
      if: always()
      run: rm -rf -- "$RUNNER_TEMP/fmr-tg-local-${GITHUB_RUN_ID}"
    defaults:
      run:
        working-directory: tg-code-${{ github.run_id }}
