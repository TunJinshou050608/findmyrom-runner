name: Private boot image extraction
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only recover stale locks and inspect the queue
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: production-extraction
  cancel-in-progress: false
jobs:
  extract:
    # Enable only after the production secrets and private Vault are verified.
    if: github.ref == 'refs/heads/main' && (vars.FMR_EXTRACTION_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Extract and archive privately
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          SIGN_PRIVATE_KEY_HEX: ${{ secrets.SIGN_PRIVATE_KEY_HEX }}
          GH_VAULT_TOKEN: ${{ secrets.GH_VAULT_TOKEN }}
          GH_VAULT_REPO: ${{ secrets.GH_VAULT_REPO }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python -m fmr_extractor.cli --dry-run
          else
            python -m fmr_extractor.cli --batch-limit 100 --max-workers 4 --max-runtime-sec 900
          fi
