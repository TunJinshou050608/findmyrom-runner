name: TG cache probe
'on':
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on:
    - self-hosted
    - findmyrom-metadata
    timeout-minutes: 10
    environment: production
    env:
      LLM_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      LLM_MODEL_NAME: deepseek-flash
      LLM_MAX_TOKENS: '1500'
      LLM_TIMEOUT_SECONDS: '120'
      FMR_TG_CACHE_PROBE_WAIT: '20'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: python -m pip install -r requirements.txt
    - name: Run fixed-post two-pass cache probe
      run: python -u -m fmr_tg_scanner.cache_probe
