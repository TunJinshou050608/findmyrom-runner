name: TG cache probe
'on':
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on:
    - self-hosted
    - findmyrom-metadata
    timeout-minutes: 10
    environment: production
    env:
      LLM_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      LLM_MODEL_NAME: deepseek-flash
      LLM_MAX_TOKENS: '1500'
      LLM_TIMEOUT_SECONDS: '120'
      FMR_TG_CACHE_PROBE_WAIT: '20'
    steps:
    - uses: actions/checkout@v4
    - name: Prepare isolated Python
      run: |
        python3 -m venv "$RUNNER_TEMP/fmr-cache-probe"
        "$RUNNER_TEMP/fmr-cache-probe/bin/python" -m pip install -r requirements.txt
    - name: Run fixed-post two-pass cache probe
      run: "$RUNNER_TEMP/fmr-cache-probe/bin/python" -u -m fmr_tg_scanner.cache_probe
