name: CI · 离线验证
'on':
  push: null
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: runner-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python:
        - '3.11'
        - '3.12'
        - '3.13'
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}
    - run: python -m pip install -r requirements.txt
    - run: FMR_TEST_NO_SLEEP=1 python verify_sp02.py
    - run: python verify_sp03.py --skip-unit-tests
