name: Runner offline verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: runner-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python verify_sp02.py
      - run: python verify_sp03.py
      - run: FMR_TEST_NO_SLEEP=1 python -m pytest -v


  resume_catalogue:
    name: "接续旧进度，恢复采集及10分钟发布"
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[catalogue-v3]')
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      GH_WORKFLOW_TOKEN: ${{ github.token }}
      SIGN_PRIVATE_KEY_HEX: ${{ secrets.SIGN_PRIVATE_KEY_HEX }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: "暂停旧D1写入入口，保留所有检查点"
        run: python -u -m fmr_ingest_stock.staged_catalogue prepare
      - name: "只读迁移D1旧检查点，之后采集不再访问D1"
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python -u -m fmr_ingest_stock.staged_catalogue baseline
      - name: "保存加密迁移快照"
        uses: actions/upload-artifact@v4
        with:
          name: catalogue-v3-baseline
          path: catalogue-state/upload/*.sqlite.enc
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: "启用厂商入口及统一发布，提交启动后停止"
        run: python -u -m fmr_ingest_stock.quota_resume
