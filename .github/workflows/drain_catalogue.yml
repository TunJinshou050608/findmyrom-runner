name: D1 · 一次性清空积压
'on':
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: false
        description: '只验证 runner 和 checkpoint，不写 D1'
      vendors:
        description: '逗号分隔的 vendor 子集（空 = 全部）'
        default: ''
      shard:
        description: '并行分片名，空 = 默认单进程'
        default: ''
      runner:
        type: choice
        options:
        - publisher
        - metadata
        default: publisher
        description: '运行 runner 池'
      skip_export:
        type: boolean
        default: false
        description: '不覆盖共享 publisher checkpoint（分片用）'
      shard_index:
        description: '设备哈希分片序号（从 0 开始）'
        default: '0'
      shard_count:
        description: '设备哈希分片总数'
        default: '1'
      processes:
        description: '同一 runner 上的并行发布进程数'
        default: '1'
      count_only:
        type: boolean
        default: false
        description: '只统计本地未发布数量，不写 D1'
      merge_shards:
        type: boolean
        default: false
        description: '并行跑完后合并 shard 账本并导出 publisher checkpoint'
      merge_only:
        type: boolean
        default: false
        description: '只合并已有 shard 账本并导出 checkpoint，不跑发布'
  schedule:
  # 2026-11-04 20:00 UTC = 2026-11-05 04:00 Asia/Shanghai.
  # The Cloudflare free D1 write allowance resets at 08:00 Asia/Shanghai.
  - cron: '0 20 4 11 *'
  # Backup slots: GitHub occasionally drops or delays a scheduled event.
  # The date guard below still limits every attempt to 2026-11-04 UTC.
  - cron: '10 20 4 11 *'
  - cron: '30 20 4 11 *'
permissions:
  contents: read
  actions: write
jobs:
  drain:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ fromJSON(inputs.runner == 'metadata' && vars.FMR_CATALOGUE_RUNNER || vars.FMR_PUBLISH_RUNNER || '["self-hosted","findmyrom-publisher"]') }}
    timeout-minutes: 350
    environment: production
    concurrency:
      group: catalogue-d1-publisher-${{ inputs.shard || 'all' }}
      cancel-in-progress: false
    env:
      GH_WORKFLOW_TOKEN: ${{ github.token }}
      FMR_CATALOGUE_LOCAL_STATE: ${{ inputs.runner == 'metadata' && 'false' || 'true' }}
      FMR_CATALOGUE_STATE_DIR: ${{ vars.FMR_CATALOGUE_STATE_DIR || '/var/lib/findmyrom/catalogue-v3' }}
      FMR_CATALOGUE_PUBLISH_VENDORS: ${{ inputs.vendors || '' }}
      FMR_CATALOGUE_SKIP_EXPORT: ${{ inputs.skip_export && 'true' || 'false' }}
      FMR_CATALOGUE_SHARD_INDEX: ${{ inputs.shard_index || '0' }}
      FMR_CATALOGUE_SHARD_COUNT: ${{ inputs.shard_count || '1' }}
      SIGN_PRIVATE_KEY_HEX: ${{ secrets.SIGN_PRIVATE_KEY_HEX }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      FMR_D1_WRITES_PAUSED: ${{ inputs.dry_run && 'true' || 'false' }}
      FMR_D1_BUDGET_ENFORCE: 'false'
      FMR_CATALOGUE_PUBLISH_MAX_RECORDS: '0'
      FMR_CATALOGUE_PUBLISH_FORCE: 'true'
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        path: drain-code
    - name: One-time schedule guard
      id: guard
      if: github.event_name == 'schedule'
      run: |
        if [ "$(date -u +%F)" = "2026-11-04" ]; then
          echo "run=true" >> "$GITHUB_OUTPUT"
        else
          echo "run=false" >> "$GITHUB_OUTPUT"
        fi
    - name: Prepare Python
      if: github.event_name == 'workflow_dispatch' || steps.guard.outputs.run == 'true'
      run: |
        python3 -m venv "$RUNNER_TEMP/fmr-drain-${GITHUB_RUN_ID}"
        printf '%s\n' "$RUNNER_TEMP/fmr-drain-${GITHUB_RUN_ID}/bin" >> "$GITHUB_PATH"
    - name: Install dependencies
      if: github.event_name == 'workflow_dispatch' || steps.guard.outputs.run == 'true'
      run: python -m pip install -r requirements.txt
    - name: Count pending local records
      if: inputs.count_only && !inputs.merge_only
      run: python -u -m fmr_ingest_stock.count_pending
    - name: Drain until Cloudflare reports an error
      if: (github.event_name == 'workflow_dispatch' || steps.guard.outputs.run == 'true') && !inputs.count_only && !inputs.merge_only
      env:
        FMR_CATALOGUE_PROCESSES: ${{ inputs.processes || '1' }}
      run: |
        set -o pipefail
        count="${FMR_CATALOGUE_PROCESSES:-1}"
        if [ "$count" -le 1 ]; then
          python -u -m fmr_ingest_stock.catalogue_publish
          exit $?
        fi
        pids=""
        for i in $(seq 0 $((count-1))); do
          FMR_CATALOGUE_LOCAL_STATE=false \
          FMR_CATALOGUE_STATE_DIR="$FMR_CATALOGUE_STATE_DIR/parallel-$i-${GITHUB_RUN_ID}" \
          FMR_CATALOGUE_SHARD_INDEX="$i" \
          FMR_CATALOGUE_SHARD_COUNT="$count" \
          FMR_CATALOGUE_SKIP_EXPORT=true \
          python -u -m fmr_ingest_stock.catalogue_publish 2>&1 | sed -u "s/^/[shard $i] /" &
          pids="$pids $!"
        done
        status=0
        for p in $pids; do wait "$p" || status=1; done
        exit $status
    - name: Merge parallel shard checkpoints
      if: always() && (inputs.merge_shards || inputs.merge_only) && !inputs.dry_run
      run: python -u -m fmr_ingest_stock.merge_shards
    - name: Verify publisher checkpoint
      id: export_check
      if: always() && !inputs.dry_run && (!inputs.skip_export || inputs.merge_shards || inputs.merge_only) && !inputs.count_only && (github.event_name == 'workflow_dispatch' || steps.guard.outputs.run == 'true')
      run: python -u -m fmr_ingest_stock.staged_catalogue verify-export --scope publisher
    - name: Save publisher checkpoint
      if: always() && (!inputs.skip_export || inputs.merge_shards || inputs.merge_only) && !inputs.count_only && steps.export_check.outcome == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: catalogue-v3-publisher
        path: ${{ env.FMR_CATALOGUE_STATE_DIR }}/upload/publisher.sqlite.enc
        if-no-files-found: error
    defaults:
      run:
        working-directory: drain-code
