name: TG search lab · private evidence and autonomous retrieval
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Capability probe or finite autonomous search batch
        type: choice
        options: [probe, batch, compare, focus]
        default: probe
      state_repo:
        description: Target private test repository to record products and logs
        type: string
        default: TunJinshou050608/findmyrom-tg01-test
permissions:
  contents: read
concurrency:
  # Focus runs read the resident snapshot and write a separate experiment dir.
  group: ${{ inputs.mode == 'focus' && 'tg-search-focus' || 'tg01-annibale-private-trial' }}
  cancel-in-progress: false
jobs:
  lab:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, findmyrom-metadata]
    timeout-minutes: 35
    environment: production
    env:
      FMR_CATALOGUE_STATE_DIR: ${{ vars.FMR_CATALOGUE_STATE_DIR || '/var/lib/findmyrom/catalogue-v3' }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: runner
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.state_repo }}
          path: state
          ssh-key: ${{ secrets.GH_TG_TEST_SSH_KEY }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r runner/requirements.txt
      - name: Read TG metadata; never access D1 or download firmware
        working-directory: runner
        env:
          LAB_MODE: ${{ inputs.mode }}
          GITHUB_TOKEN: ${{ github.token }}
          LLM_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LLM_MODEL_NAME: deepseek-flash
          LLM_REASONING_EFFORT: low
        run: |
          if [ "$LAB_MODE" = probe ]; then
            python -u -m fmr_tg_scanner.search_probe --state-dir ../state
          else
            python -u -m fmr_tg_scanner.search_lab --state-dir ../state --mode "$LAB_MODE"
          fi
      - name: Persist private test products and detailed logs
        if: always()
        working-directory: runner
        run: |
          python - <<'PY'
          from pathlib import Path
          from fmr_tg_scanner.watch import publish_private
          publish_private(Path('../state').resolve())
          PY
