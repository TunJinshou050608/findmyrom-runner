name: 固件采集 · 小米 / Redmi / POCO
run-name: 小米 / Redmi / POCO · 增量更新 · 第 ${{ inputs.batch || '1' }} 批
'on':
  schedule:
  - cron: 5 */6 * * *
  workflow_dispatch:
    inputs:
      operation:
        description: 增量续跑 / 重试失败项 / 重新核对来源
        type: choice
        options:
        - incremental
        - retry_failed
        - refresh_sources
        default: incremental
      mode:
        description: 兼容旧入口；采集仅暂存，由每10分钟统一发布
        type: choice
        options:
        - audit
        - publish
        default: audit
      cycle:
        description: 兼容旧续跑参数，手动留空
        default: ''
      batch:
        description: 自动续跑批次
        default: '1'
  push:
    branches:
    - main
    paths:
    - .github/workflows/catalogue_xiaomi.yml
permissions:
  contents: read
  actions: write
concurrency:
  group: catalogue-v2-xiaomi
  cancel-in-progress: false
jobs:
  catalogue:
    name: 采集、复用缓存、加密保存断点（不访问D1）
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ fromJSON(vars.FMR_CATALOGUE_RUNNER || '["self-hosted","findmyrom-metadata"]') }}
    timeout-minutes: 20
    environment: production
    env:
      GH_WORKFLOW_TOKEN: ${{ github.token }}
      FMR_CATALOGUE_LOCAL_STATE: 'true'
      FMR_CATALOGUE_STATE_DIR: ${{ vars.FMR_CATALOGUE_STATE_DIR || '/var/lib/findmyrom/catalogue-v3' }}
      SIGN_PRIVATE_KEY_HEX: ${{ secrets.SIGN_PRIVATE_KEY_HEX }}
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        path: catalogue-code
    - name: Prepare isolated Python environment
      shell: bash
      run: |
        python3 -m venv "$RUNNER_TEMP/fmr-python"
        printf '%s\n' "$RUNNER_TEMP/fmr-python/bin" >> "$GITHUB_PATH"
    - run: python -m pip install -r requirements.txt
    - name: 清除过期页面并回收磁盘；保留机型、版本和断点
      run: python -u -m fmr_ingest_stock.staged_catalogue maintain-cache --vendor xiaomi
    - name: 接续检查点采集（每30秒心跳，D1零请求）
      id: collect
      continue-on-error: true
      env:
        CATALOGUE_OPERATION: ${{ inputs.operation || 'incremental' }}
        COLLECT_SECONDS: ${{ github.event_name == 'push' && '90' || '420' }}
      run: python -u -m fmr_ingest_stock.staged_catalogue collect --vendor xiaomi --operation "$CATALOGUE_OPERATION" --seconds "$COLLECT_SECONDS"
    - name: 小范围核对剩余官方来源冲突（仅请求响应头）
      if: steps.collect.outcome == 'success'
      run: python -m fmr_ingest_stock.xiaomi_source_audit --network
    - name: 校验备份由本次任务生成且内容完整
      id: export_check
      if: always() && (steps.collect.outcome == 'success' || steps.collect.outcome == 'failure')
      run: python -u -m fmr_ingest_stock.staged_catalogue verify-export --scope xiaomi
    - name: 持久保存加密进度；断开后可续接
      if: always() && steps.export_check.outcome == 'success'
      id: snapshot
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: catalogue-v3-xiaomi
        path: ${{ env.FMR_CATALOGUE_STATE_DIR }}/upload/xiaomi.sqlite.enc
        if-no-files-found: error
        retention-days: 90
        compression-level: 0
    - name: 网络中断后重试保存同一份已校验快照
      id: snapshot_retry
      if: always() && steps.export_check.outcome == 'success' && steps.snapshot.outcome == 'failure'
      uses: actions/upload-artifact@v4
      with:
        name: catalogue-v3-xiaomi
        path: ${{ env.FMR_CATALOGUE_STATE_DIR }}/upload/xiaomi.sqlite.enc
        if-no-files-found: error
        retention-days: 90
        compression-level: 0
        overwrite: true
    - name: 仅保留最近三份加密快照
      if: always() && (steps.snapshot.outcome == 'success' || steps.snapshot_retry.outcome == 'success')
      run: python -m fmr_ingest_stock.staged_catalogue prune --vendor xiaomi
    - name: 有积压就自动接下一批
      if: always() && (steps.snapshot.outcome == 'success' || steps.snapshot_retry.outcome == 'success') && steps.collect.outcome == 'success'
      run: python -m fmr_ingest_stock.staged_catalogue next --vendor xiaomi
    - name: 报告快照保存失败；保留本机断点等待下次运行
      if: always() && steps.export_check.outcome == 'success' && steps.snapshot.outcome != 'success' && steps.snapshot_retry.outcome != 'success'
      run: exit 1
    - name: 报告本批中断
      if: steps.collect.outcome == 'failure'
      run: exit 1
    defaults:
      run:
        working-directory: catalogue-code
