name: TG search · paused for full quality audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/telegram_trial.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tg01-annibale-private-trial
  cancel-in-progress: true
jobs:
  paused:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, findmyrom-metadata]
    timeout-minutes: 5
    steps:
      - name: Confirm retrieval is paused
        run: echo 'TG retrieval is paused by user instruction. No scan, cadence or handoff is scheduled.'
