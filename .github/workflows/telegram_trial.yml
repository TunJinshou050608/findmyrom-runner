name: TG search · autonomous private trial and checkpoints
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: tg01-annibale-private-trial
  cancel-in-progress: false
jobs:
  trial:
    if: github.ref == 'refs/heads/main' && (vars.FMR_TG_TRIAL_ENABLED == 'true')
    runs-on: [self-hosted, findmyrom-metadata]
    timeout-minutes: 75
    environment: production
    env:
      FMR_CATALOGUE_STATE_DIR: ${{ vars.FMR_CATALOGUE_STATE_DIR || '/var/lib/findmyrom/catalogue-v3' }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: runner
          ref: main
          persist-credentials: false
      - name: Restore private test repository
        uses: actions/checkout@v4
        with:
          repository: TunJinshou050608/findmyrom-tg01-test
          path: state
          ssh-key: ${{ secrets.GH_TG_TEST_SSH_KEY }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: runner/requirements.txt
      - run: python -m pip install -r runner/requirements.txt
      - name: Scan finite pages and inspect actual products
        working-directory: runner
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LLM_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LLM_MODEL_NAME: deepseek-flash
          LLM_REASONING_EFFORT: low
        run: python -u -m fmr_tg_scanner.search_watch --state-dir ../state
      - name: Save private logs, packages and checkpoints even on failure
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd state
          if [ ! -d .git ]; then exit 1; fi
          python - <<'PY'
          from pathlib import Path
          import subprocess
          paths=[str(p) for p in Path('.').rglob('*') if p.is_file() and '.git' not in p.parts and p.suffix in ('.sqlite','.json','.jsonl')]
          if paths:subprocess.run(['git','add','--',*paths],check=True)
          PY
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name=FindMyROM -c user.email=automation@findmyrom.com commit --quiet -m 'TG01 trial: metadata, checkpoint and audit'
          git push --quiet origin HEAD:main
      - name: Hand off a completed resident session
        if: always() && !cancelled()
        env:
          GH_WORKFLOW_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          import httpx
          path=Path('state/monitor_state.json')
          if not path.exists():raise SystemExit(0)
          status=json.loads(path.read_text())
          if not status.get('handoff_ready') or status.get('session_run_id')!=os.environ['GITHUB_RUN_ID']:raise SystemExit(0)
          repo=os.environ['GITHUB_REPOSITORY']
          with httpx.Client(timeout=30,follow_redirects=False) as client:
              response=client.post('https://api.github.com/repos/'+repo+'/actions/workflows/telegram_trial.yml/dispatches',headers={'Authorization':'Bearer '+os.environ['GH_WORKFLOW_TOKEN'],'Accept':'application/vnd.github+json'},json={'ref':'main'})
          if response.status_code!=204:raise SystemExit('Resident-session handoff was not accepted; cron remains the fallback.')
          print('Next bounded session accepted; the private cadence timestamp is retained.')
          PY
      - name: Public status summary
        if: always()
        run: echo 'Detailed metadata logs, checkpoints and LLM call/error counts are in the dedicated PRIVATE test repository. No D1 queries or ROM downloads. Optional bounded LLM classification uses DEEPSEEK_API_KEY; missing or invalid credentials are reported. The resident process checks every 10 minutes and hands off after a bounded session; cron is a fallback.' >> "$GITHUB_STEP_SUMMARY"
