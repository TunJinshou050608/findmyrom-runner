name: TG · 原文重处理
'on':
  workflow_dispatch:
    inputs:
      limit:
        description: 'Limit rows for a canary (0 = all)'
        default: '0'
      concurrency:
        description: 'Concurrent model calls'
        default: '4'
      device:
        description: 'Device codename filter (empty = all)'
        default: ''
permissions:
  contents: read
jobs:
  reprocess:
    if: github.ref == 'refs/heads/main'
    runs-on:
    - self-hosted
    - findmyrom-metadata
    timeout-minutes: 115
    environment: production
    env:
      LLM_MODEL_NAME: deepseek-flash
      LLM_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      LLM_MAX_TOKENS: '1500'
      LLM_TIMEOUT_SECONDS: '120'
      LLM_API_BASE_URL: https://api.deepseek.com/v1
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        path: reprocess-code
    - name: Prepare Python
      run: |
        python3 -m venv "$RUNNER_TEMP/fmr-reprocess-${GITHUB_RUN_ID}"
        printf '%s\n' "$RUNNER_TEMP/fmr-reprocess-${GITHUB_RUN_ID}/bin" >> "$GITHUB_PATH"
    - run: python -m pip install -r requirements.txt
    - name: Export original D1 messages
      run: python -u -m fmr_tg_scanner.reprocess --export-d1 --output "$RUNNER_TEMP/tg_reprocess_inputs.jsonl"
    - name: Re-extract and normalize
      run: python -u -m fmr_tg_scanner.reprocess --input "$RUNNER_TEMP/tg_reprocess_inputs.jsonl" --output "$RUNNER_TEMP/tg_reprocess_output.jsonl" --limit "${{ inputs.limit || '0' }}" --concurrency "${{ inputs.concurrency || '4' }}" --device "${{ inputs.device || '' }}"
    - name: Upload reprocess result
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: tg-reprocess-output
        path: ${{ runner.temp }}/tg_reprocess_output.jsonl
        if-no-files-found: warn
    defaults:
      run:
        working-directory: reprocess-code
