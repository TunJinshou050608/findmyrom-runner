name: Verify production credentials
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-credential-probe
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Verify private archive and Worker gateway; clean up diagnostic data
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          SIGN_PRIVATE_KEY_HEX: ${{ secrets.SIGN_PRIVATE_KEY_HEX }}
          GH_VAULT_TOKEN: ${{ secrets.GH_VAULT_TOKEN }}
          GH_VAULT_REPO: ${{ secrets.GH_VAULT_REPO }}
        run: python verify_live_credentials.py
