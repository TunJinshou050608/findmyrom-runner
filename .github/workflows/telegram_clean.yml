name: TG · 清洗
'on':
  workflow_dispatch: null
  workflow_run:
    workflows:
    - TG · 抓取
    types:
    - completed
    branches:
    - main
permissions:
  contents: read
concurrency:
  group: tg01-annibale-private-trial
  cancel-in-progress: false
jobs:
  clean:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on:
    - self-hosted
    - findmyrom-metadata
    timeout-minutes: 90
    environment: production
    env:
      FMR_CATALOGUE_STATE_DIR: ${{ vars.FMR_CATALOGUE_STATE_DIR || '/var/lib/findmyrom/catalogue-v3' }}
    steps:
    - uses: actions/checkout@v4
      with:
        path: runner
        persist-credentials: false
    - uses: actions/checkout@v4
      with:
        repository: TunJinshou050608/findmyrom-tg01-test
        path: state
        ssh-key: ${{ secrets.GH_TG_TEST_SSH_KEY }}
        persist-credentials: true
    - name: Prepare local container Python
      run: |-
        python3 -m venv "$RUNNER_TEMP/fmr-tg-${GITHUB_RUN_ID}"
        printf '%s\n' "$RUNNER_TEMP/fmr-tg-${GITHUB_RUN_ID}/bin" >> "$GITHUB_PATH"
    - run: python -m pip install -r runner/requirements.txt
    - name: Audit all saved evidence; no TG requests or D1 writes
      working-directory: runner
      run: python -u -m fmr_tg_scanner.quality_audit --state-dir ../state
    - name: Save private checkpoints and receipts
      if: always()
      working-directory: runner
      run: |-
        python - <<'PYCODE'
        from pathlib import Path
        from fmr_tg_scanner.watch import publish_private
        publish_private(Path('../state').resolve())
        PYCODE
