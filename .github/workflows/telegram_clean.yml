name: TG · 清洗
'on':
  push:
    branches:
    - main
    paths:
    - .github/workflows/telegram_clean.yml
  schedule:
  - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      max_calls:
        description: 'Max LLM calls per cycle (production 150; canary 5)'
        default: '150'
      duration:
        description: 'Cleaner duration seconds (production 600; canary 120)'
        default: '600'
      debug_sample:
        description: 'Print one live request/response (canary)'
        default: 'false'
      self_continue:
        description: 'Re-dispatch this workflow after the batch (production loop)'
        default: 'false'
      queue_limit:
        description: 'Max real-time tg_cleaning_queue items fetched per cycle'
        default: '200'
      backlog_limit:
        description: 'Bounded historical uncleaned_backlog items scanned per cycle'
        default: '400'
permissions:
  contents: read
  actions: write
jobs:
  clean:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on:
    - self-hosted
    - findmyrom-metadata
    timeout-minutes: 115
    environment: production
    env:
      FMR_TG_STATE_DIR: ${{ vars.FMR_TG_STATE_DIR || format('{0}/tg-v4', vars.FMR_CATALOGUE_STATE_DIR || '/var/lib/findmyrom/catalogue-v3') }}
      FMR_CATALOGUE_STATE_DIR: ${{ vars.FMR_CATALOGUE_STATE_DIR || '/var/lib/findmyrom/catalogue-v3' }}
      FMR_TG_LOCAL_RUNTIME: 'true'
      FMR_TG_V2_CLEANER: 'true'
      FMR_TG_INTENT_MODEL_DIR: /var/lib/findmyrom/models/tg-intent-v2
      FMR_TG_GROUNDED_CLEANER: 'true'
      FMR_TG_CLEAN_MAX_CALLS: ${{ inputs.max_calls || '150' }}
      FMR_TG_V2_QUEUE_LIMIT: ${{ inputs.queue_limit || '200' }}
      FMR_TG_V2_BACKLOG_LIMIT: ${{ inputs.backlog_limit || '400' }}
      FMR_TG_DISPATCH_PUBLISH: 'false'
      LLM_MODEL_NAME: deepseek-flash
      LLM_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      LLM_MAX_TOKENS: '1500'
      LLM_TIMEOUT_SECONDS: '120'
      LLM_API_BASE_URL: https://api.deepseek.com/v1
      FMR_TG_CLEAN_CONCURRENCY: '4'
      FMR_TG_CLEAN_DEBUG_SAMPLE: ${{ inputs.debug_sample || 'false' }}
    name: 单独筛选器 · 一致性快照与质量审核
    concurrency:
      group: tg-local-cleaner
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        path: tg-code-${{ github.run_id }}
    - name: Confirm local runner and prepare Python
      run: |-
        printf "Runner: %s; host: %s\n" "$RUNNER_NAME" "$(hostname)"
        if [ -x /opt/fmr-tg-v2-venv/bin/python ]; then
          printf '%s\n' "/opt/fmr-tg-v2-venv/bin" >> "$GITHUB_PATH"
        else
          python3 -m venv "$RUNNER_TEMP/fmr-tg-local-${GITHUB_RUN_ID}"
          printf '%s\n' "$RUNNER_TEMP/fmr-tg-local-${GITHUB_RUN_ID}/bin" >> "$GITHUB_PATH"
          python -m pip install -r requirements.txt
        fi
    - name: Audit local snapshots; request unified publisher only when a batch changes
      id: clean
      env:
        GH_WORKFLOW_TOKEN: ${{ github.token }}
        CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
        CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      run: python -u -m fmr_tg_scanner.local_runtime clean --state-dir "$FMR_TG_STATE_DIR" --duration "${{ inputs.duration || '600' }}"
    - name: Upload cleaning model usage report
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: tg-clean-report-${{ github.run_id }}
        path: |
          ${{ env.FMR_TG_STATE_DIR }}/v2-clean-latest.json
          ${{ env.FMR_TG_STATE_DIR }}/clean/audits/full-quality-*/report.json
        if-no-files-found: warn
    - name: Continue the independent cleaner
      if: ${{ always() && !cancelled() && steps.clean.outcome == 'success' && (inputs.self_continue == 'true' || github.event_name == 'schedule') }}
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        SELF_CONTINUE_INPUT: ${{ inputs.self_continue }}
        TRIGGER_EVENT: ${{ github.event_name }}
        NEXT_MAX_CALLS: ${{ inputs.max_calls || '150' }}
        NEXT_DURATION: ${{ inputs.duration || '600' }}
        NEXT_QUEUE_LIMIT: ${{ inputs.queue_limit || '200' }}
        NEXT_BACKLOG_LIMIT: ${{ inputs.backlog_limit || '400' }}
      run: |
        set -euo pipefail
        PENDING="$(python - <<'PY'
        import os, sqlite3
        from pathlib import Path
        db_path = Path(os.environ["FMR_TG_STATE_DIR"]) / "clean" / "search-v3" / "search.sqlite"
        if not db_path.is_file():
            print(0)
        else:
            with sqlite3.connect(db_path, timeout=10) as conn:
                row = conn.execute("SELECT COUNT(*) FROM tg_cleaning_queue WHERE status = 'pending'").fetchone()
                print(int(row[0]) if row else 0)
        PY
        )"
        if [ "${PENDING:-0}" -le 0 ]; then
          echo "Cleaning queue has 0 pending items; stopping chain."
          exit 0
        fi
        echo "Cleaning queue still has ${PENDING} pending items; dispatching continuation."
        for attempt in 1 2 3; do
          if gh workflow run telegram_clean.yml --ref main \
            -f self_continue=true \
            -f max_calls="$NEXT_MAX_CALLS" \
            -f duration="$NEXT_DURATION" \
            -f queue_limit="$NEXT_QUEUE_LIMIT" \
            -f backlog_limit="$NEXT_BACKLOG_LIMIT"; then
            exit 0
          fi
          if [ "$attempt" -lt 3 ]; then
            sleep $((attempt * 10))
          fi
        done
        echo "Failed to dispatch continuation after 3 attempts" >&2
        exit 1
    defaults:
      run:
        working-directory: tg-code-${{ github.run_id }}
