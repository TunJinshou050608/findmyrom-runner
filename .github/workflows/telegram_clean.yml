name: TG · 清洗
'on':
  push:
    branches:
    - main
    paths:
    - .github/workflows/telegram_clean.yml
  schedule:
  - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      max_calls:
        description: 'Max LLM calls (test phase default: 50)'
        default: '50'
      duration:
        description: 'Cleaner duration seconds (test phase default: 600)'
        default: '600'
      debug_sample:
        description: 'Print one live request/response (canary)'
        default: 'false'
permissions:
  contents: read
  actions: write
jobs:
  clean:
    if: github.ref == 'refs/heads/main' && github.event_name != 'push'
    runs-on:
    - self-hosted
    - findmyrom-metadata
    timeout-minutes: 115
    environment: production
    env:
      FMR_TG_STATE_DIR: ${{ vars.FMR_TG_STATE_DIR || format('{0}/tg-v4', vars.FMR_CATALOGUE_STATE_DIR || '/var/lib/findmyrom/catalogue-v3') }}
      FMR_CATALOGUE_STATE_DIR: ${{ vars.FMR_CATALOGUE_STATE_DIR || '/var/lib/findmyrom/catalogue-v3' }}
      FMR_TG_LOCAL_RUNTIME: 'true'
      FMR_TG_GROUNDED_CLEANER: 'true'
      FMR_TG_CLEAN_MAX_CALLS: ${{ inputs.max_calls || '50' }}
      LLM_MODEL_NAME: deepseek-flash
      LLM_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      LLM_MAX_TOKENS: '1500'
      LLM_TIMEOUT_SECONDS: '120'
      LLM_API_BASE_URL: https://api.deepseek.com/v1
      FMR_TG_CLEAN_CONCURRENCY: '4'
      FMR_TG_CLEAN_DEBUG_SAMPLE: ${{ inputs.debug_sample || 'false' }}
    name: 单独筛选器 · 一致性快照与质量审核
    concurrency:
      group: tg-local-cleaner
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        path: tg-code-${{ github.run_id }}
    - name: Confirm local runner and prepare Python
      run: |-
        printf "Runner: %s; host: %s\n" "$RUNNER_NAME" "$(hostname)"
        python3 -m venv "$RUNNER_TEMP/fmr-tg-local-${GITHUB_RUN_ID}"
        printf '%s\n' "$RUNNER_TEMP/fmr-tg-local-${GITHUB_RUN_ID}/bin" >> "$GITHUB_PATH"
    - run: python -m pip install -r requirements.txt
    - name: Audit local snapshots; request unified publisher only when a batch changes
      env:
        GH_WORKFLOW_TOKEN: ${{ github.token }}
      run: python -u -m fmr_tg_scanner.local_runtime clean --state-dir "$FMR_TG_STATE_DIR" --duration "${{ inputs.duration || '600' }}"
    - name: Upload cleaning model usage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: tg-clean-report-${{ github.run_id }}
        path: ${{ env.FMR_TG_STATE_DIR }}/clean/audits/full-quality-*/report.json
        if-no-files-found: warn
    - name: Continue the independent cleaner
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: gh workflow run telegram_clean.yml --ref main
    defaults:
      run:
        working-directory: tg-code-${{ github.run_id }}
