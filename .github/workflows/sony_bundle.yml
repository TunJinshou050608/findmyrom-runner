name: "Sony Xperia · 打包完整固件 ZIP"
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sony-complete-bundle-cache
  cancel-in-progress: false
jobs:
  bundle:
    name: "按需下载并打包成一个 ZIP（不提取镜像）"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: "有请求才构建，成品为单个完整 ZIP"
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          SONY_BUNDLE_UPLOAD_SECRET: ${{ secrets.SONY_BUNDLE_UPLOAD_SECRET }}
        run: python -u -m fmr_ingest_stock.sony_bundle
