name: Publication canary
'on':
  push:
    branches:
    - main
    paths:
    - .github/workflows/publication-canary.yml
permissions:
  contents: read
  actions: write
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ fromJSON(vars.FMR_PUBLISH_RUNNER || vars.FMR_CATALOGUE_RUNNER ||
      '["self-hosted","findmyrom-metadata"]') }}
    timeout-minutes: 20
    environment: production
    env:
      GH_WORKFLOW_TOKEN: ${{ github.token }}
      FMR_CATALOGUE_LOCAL_STATE: 'true'
      FMR_CATALOGUE_STATE_DIR: ${{ vars.FMR_CATALOGUE_STATE_DIR || '/var/lib/findmyrom/catalogue-v3'
        }}
      SIGN_PRIVATE_KEY_HEX: ${{ secrets.SIGN_PRIVATE_KEY_HEX }}
      FMR_D1_WRITES_PAUSED: 'false'
      FMR_CATALOGUE_PUBLISH_MAX_RECORDS: '5'
      FMR_CATALOGUE_PUBLISH_ONCE: 'true'
      FMR_CATALOGUE_PUBLISH_VENDORS: xiaomi
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        path: publisher-code
        ref: d1f95a9b60f8056dff8a65fa6fae8baa83a80487
    - name: Prepare isolated Python environment
      shell: bash
      run: 'python3 -m venv "$RUNNER_TEMP/fmr-python"

        printf ''%s\n'' "$RUNNER_TEMP/fmr-python/bin" >> "$GITHUB_PATH"

        '
    - run: python -m pip install -r requirements.txt
    - name: 去重后批量入库；按实际行数控制预算
      env:
        CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
        CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      run: python -u -m fmr_ingest_stock.catalogue_publish_monitor
      id: sync
    - name: 校验本次发布确认点的新鲜度和完整性
      id: export_check
      if: always() && (steps.sync.outcome == 'success' || steps.sync.outcome == 'failure')
      run: python -u -m fmr_ingest_stock.staged_catalogue verify-export --scope publisher
    - name: 保存发布确认点，失败也保留成功部分
      if: always() && steps.export_check.outcome == 'success'
      id: snapshot
      uses: actions/upload-artifact@v4
      with:
        name: catalogue-v3-publisher
        path: ${{ env.FMR_CATALOGUE_STATE_DIR }}/upload/publisher.sqlite.enc
        if-no-files-found: error
        retention-days: 90
        compression-level: 0
    - name: 仅保留最近三份发布确认点
      if: steps.snapshot.outcome == 'success'
      run: 'python -c ''from fmr_ingest_stock.staged_catalogue import Artifacts; a=Artifacts();
        a.prune("publisher"); a.close()''

        '
    name: 官包 · 每10分钟增量发布
    concurrency:
      group: catalogue-d1-publisher
      cancel-in-progress: false
    defaults:
      run:
        working-directory: publisher-code
