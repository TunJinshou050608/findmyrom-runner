name: "ASUS · 固件目录更新"
run-name: "ASUS · 增量更新 · 第 ${{ inputs.batch || '1' }} 批"
on:
  schedule:
    - cron: '37 */6 * * *'
  workflow_dispatch:
    inputs:
      operation:
        description: "incremental：增量续跑；retry_failed：也重试失败项；refresh_sources：重新核对来源页面"
        type: choice
        options: [incremental, retry_failed, refresh_sources]
        default: incremental
      mode:
        description: "audit：检查目录；publish：另将已解析的稳定链接增量入库（不提取镜像）"
        type: choice
        options: [audit, publish]
        default: audit
      cycle:
        description: "自动续跑参数，手动启动请留空"
        type: string
        default: ''
      batch:
        description: "自动续跑批次，手动启动保持 1"
        type: string
        default: '1'
permissions:
  contents: read
  actions: write
concurrency:
  group: catalogue-v2-asus
  cancel-in-progress: false
jobs:
  catalogue:
    name: "检查新增版本、复用缓存、保存断点"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production
    steps:
      - name: "读取脚本"
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: "准备 Python"
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: "安装运行依赖"
        run: python -m pip install -r requirements.txt
      - name: "接续检查点并增量更新（每 30 秒输出心跳）"
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          SIGN_PRIVATE_KEY_HEX: ${{ secrets.SIGN_PRIVATE_KEY_HEX }}
          GH_WORKFLOW_TOKEN: ${{ github.token }}
          CATALOGUE_MODE: ${{ inputs.mode || 'audit' }}
          CATALOGUE_OPERATION: ${{ inputs.operation || 'incremental' }}
          CATALOGUE_CYCLE: ${{ inputs.cycle }}
          CATALOGUE_BATCH: ${{ inputs.batch || '1' }}
        run: python -u -m fmr_ingest_stock.vendor_catalogue --vendor asus --mode "$CATALOGUE_MODE" --operation "$CATALOGUE_OPERATION" --cycle "$CATALOGUE_CYCLE" --batch "$CATALOGUE_BATCH"
