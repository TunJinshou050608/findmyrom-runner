name: TG search capability probe (one shot)
on:
  push:
    branches: ['diagnostics/tg-search-v2-20261101']
    paths: ['.github/workflows/tg_search_probe.yml','diagnostics/tg_search_probe.py']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: TunJinshou050608/findmyrom-tg01-test
          path: state
          ssh-key: ${{ secrets.GH_TG_TEST_SSH_KEY }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - name: Check public search endpoints once (no D1, no messages)
        run: python -u diagnostics/tg_search_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tg-search-capability-summary
          path: probe-summary.json
          retention-days: 7
