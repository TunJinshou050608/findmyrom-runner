    display_name: LineageOS
    aliases: ["lineageos", "lineage", "los"]
    resource_kind: rom
    tier: custom_rom_mainstream
    status: active
    exclude_official_in_tg: true
    ingest_strategy: github_json_and_updater_api
    official_urls:
      devices_repo: https://github.com/LineageOS/hudson
      updater_api_repo: https://github.com/lineageos-infra/updater
