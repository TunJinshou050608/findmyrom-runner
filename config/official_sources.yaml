# FindMyROM Official Custom ROM / Recovery / Stock Tracker Registry
# Single source of truth for:
#   1. TG Pipeline v2 Layer 1 (pre-E5 metadata-only channel blocklist — NO body-text regex)
#   2. TG Pipeline v2 Layer 3 (post-DeepSeek semantic filter for official mainstream builds)
#   3. Future standardized official ROM / Recovery ingest adapters
#
# Audited against live GitHub / official portals: 2026-11-21
schema_version: 1
last_verified: "2026-11-21"

# ---------------------------------------------------------------------------
# Layer 1: Pure metadata-only TG channel blocklist (exact lowercase username)
# Policy: NEVER run body-text regex before E5. Only skip channels verified to
# broadcast exclusively official OEM stock/firmware or official mainstream builds.
# ---------------------------------------------------------------------------
tg_layer1_channel_blocklist:
  oem_stock_trackers:
    - username: miuiupdatestracker
      covers: [xiaomi_stock]
      url: https://t.me/MIUIUpdatesTracker
    - username: xiaomifirmwareupdater
      covers: [xiaomi_firmware]
      url: https://t.me/XiaomiFirmwareUpdater
    - username: miui_download
      covers: [xiaomi_stock]
      url: https://t.me/miui_download

  official_custom_rom_broadcasts:
    - username: crdroidupdates
      project: crdroid
      url: https://t.me/s/crDroidUpdates
    - username: evolutionxofficial
      project: evolution_x
      url: https://t.me/s/EvolutionXOfficial
    - username: pixelosofficial
      project: pixelos
      url: https://t.me/s/PixelOSOfficial
    - username: infinityxupdate
      project: project_infinity_x
      url: https://t.me/s/InfinityXUpdate
    - username: risingrevived
      project: risingos_revived
      url: https://t.me/s/RisingRevived
    - username: voltageosannouncements
      project: voltageos
      url: https://t.me/s/voltageosannouncements
    - username: paranoidandroidofficial
      project: paranoid_android
      url: https://t.me/s/paranoidandroidofficial
    - username: mydataismydata
      project: eos
      url: https://t.me/s/mydataismydata

  official_recovery_broadcasts:
    - username: orangefoxupdates
      project: orangefox
      url: https://t.me/s/OrangeFoxUpdates

# Optional metadata-only OEM direct-download hosts (for stock firmware detection)
oem_stock_domains:
  - bigota.d.miui.com
  - hugeota.d.miui.com
  - bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com
  - dl.google.com

# ---------------------------------------------------------------------------
# Layer 3: Standardized official projects (planned/active official adapters)
# Policy: When DeepSeek extracts a matching project AND release_status == "official",
# suppress from TG output (unofficial / port / community builds are ALWAYS kept).
# ---------------------------------------------------------------------------
projects:
